name: Build Android APK
on:
  workflow_dispatch:
  pull_request:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      # The runner image already ships the Android SDK (ANDROID_HOME); the Android Gradle
      # plugin downloads the missing platform itself. (setup-android@v3 broke: it installs
      # the removed 'tools' package.)
      - uses: gradle/actions/setup-gradle@v4
      - name: Build debug APK
        run: ./gradlew :app:assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: quizara-debug
          path: app/build/outputs/apk/debug/app-debug.apk
